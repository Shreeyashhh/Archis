<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — PCMC Washing Centre Mini ERP</title>
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="admin.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.25rem;
      background: var(--bg-deep);
    }
    .login-container {
      width: 100%;
      max-width: 400px;
    }
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .login-logo {
      width: 48px;
      height: 48px;
      margin-bottom: 0.65rem;
      border-radius: var(--radius-md);
    }
    .login-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
    }
    .login-subtitle {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-top: 0.2rem;
    }
    .alert-box {
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      margin-bottom: 1.15rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
    }
    .alert-error {
      background: var(--accent-danger-subtle);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .alert-info {
      background: var(--accent-primary-subtle);
      border: 1px solid var(--accent-primary-border);
      color: #60a5fa;
    }
    .input-with-icon {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 17px;
      height: 17px;
    }
    .input-with-icon input {
      padding-left: 2.5rem;
      width: 100%;
    }
    .btn-toggle-pwd {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }
    .login-footer-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.75rem;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .login-footer-links a:hover {
      color: var(--accent-cyan);
    }
    @media (max-width: 480px) {
      body {
        padding: 0.75rem;
      }
      .login-container {
        max-width: 100%;
      }
      .login-card {
        padding: 1.35rem 1.15rem;
        border-radius: var(--radius-md);
      }
      .login-brand {
        margin-bottom: 1.25rem;
      }
      .login-title {
        font-size: 1.1rem;
      }
      .login-logo {
        width: 42px;
        height: 42px;
      }
      .login-footer-links {
        flex-direction: column;
        gap: 0.75rem;
        text-align: center;
        margin-top: 1.35rem;
      }
    }
  </style>
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <img src="../logo.png" alt="PCMC Washing Centre" class="login-logo">
        <h1 class="login-title">PCMC <span class="brand-accent">ERP</span> PORTAL</h1>
        <p class="login-subtitle">Secure Business Management & Analytics</p>
      </div>

      <div id="login-alert" class="alert-box alert-error">
        <i data-lucide="alert-circle" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
        <span id="login-alert-text">Invalid login credentials.</span>
      </div>

      <form id="admin-login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Admin Email Address</label>
          <div class="input-with-icon">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="login-email" class="form-control" placeholder="admin@pcmcwashingcentre.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-with-icon">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="btn-toggle-pwd" id="btn-toggle-pwd" aria-label="Toggle password visibility">
              <i data-lucide="eye" style="width: 16px; height: 16px;"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-login" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;">
          <i data-lucide="log-in"></i> Sign In to ERP
        </button>
      </form>

      <div class="login-footer-links" style="justify-content: center;">
        <a href="../index.html"><i data-lucide="arrow-left" style="width: 14px; height: 14px; vertical-align: middle;"></i> Return to Website</a>
      </div>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      const form = document.getElementById('admin-login-form');
      const emailInput = document.getElementById('login-email');
      const pwdInput = document.getElementById('login-password');
      const alertBox = document.getElementById('login-alert');
      const alertText = document.getElementById('login-alert-text');
      const submitBtn = document.getElementById('btn-login');
      const togglePwdBtn = document.getElementById('btn-toggle-pwd');

      // Check URL error parameter
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('error') === 'unauthorized') {
        showAlert('Access Denied: Your account is authenticated but not registered in authorized administrators list.');
      } else if (urlParams.get('error') === 'auth_error') {
        showAlert('Session expired or authentication error. Please log in again.');
      }

      function showAlert(msg) {
        alertText.textContent = msg;
        alertBox.style.display = 'flex';
        lucide.createIcons();
      }

      // Password toggle
      togglePwdBtn.addEventListener('click', () => {
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        togglePwdBtn.innerHTML = isPwd ? '<i data-lucide="eye-off" style="width:16px;height:16px;"></i>' : '<i data-lucide="eye" style="width:16px;height:16px;"></i>';
        lucide.createIcons();
      });

      // Submit Login
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const email = emailInput.value.trim();
        const password = pwdInput.value;

        if (!email || !password) {
          showAlert('Please enter both email and password.');
          return;
        }

        const currentlyConfigured = window.PCMC_SUPABASE && window.PCMC_SUPABASE.isReady();
        if (!currentlyConfigured) {
          showAlert('Supabase connection is not configured yet. Please verify your Supabase settings.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i data-lucide="loader" class="spin"></i> Signing in...';
        lucide.createIcons();

        try {
          const authHandler = window.PCMC_AUTH || (typeof PCMC_AUTH !== 'undefined' ? PCMC_AUTH : null);
          if (!authHandler || typeof authHandler.login !== 'function') {
            throw new Error('Authentication module failed to load. Please refresh the page and try again.');
          }

          await authHandler.login(email, password);
          const redirect = urlParams.get('redirect') || 'dashboard.html';
          window.location.href = redirect;
        } catch (err) {
          showAlert(err.message || 'Failed to sign in. Please verify your email and password.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i data-lucide="log-in"></i> Sign In to ERP';
          lucide.createIcons();
        }
      });
    });
  </script>
</body>
</html>
