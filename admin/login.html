<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — PCMC Washing Centre Mini ERP</title>
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="admin.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
    }
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.08);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
    }
    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      width: 58px;
      height: 58px;
      margin-bottom: 0.75rem;
    }
    .login-title {
      font-size: 1.35rem;
      font-weight: 800;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }
    .alert-box {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
      align-items: center;
      gap: 0.6rem;
    }
    .alert-error {
      background: rgba(255, 42, 95, 0.12);
      border: 1px solid rgba(255, 42, 95, 0.3);
      color: #ff527b;
    }
    .alert-info {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: var(--accent-cyan);
    }
    .input-with-icon {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 17px;
      height: 17px;
    }
    .input-with-icon input {
      padding-left: 2.5rem;
      width: 100%;
    }
    .btn-toggle-pwd {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }
    .login-footer-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.75rem;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .login-footer-links a:hover {
      color: var(--accent-cyan);
    }
    .demo-access-box {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <img src="../logo.png" alt="PCMC Washing Centre" class="login-logo">
        <h1 class="login-title">PCMC <span class="brand-accent">ERP</span> PORTAL</h1>
        <p class="login-subtitle">Secure Business Management & Analytics</p>
      </div>

      <div id="login-alert" class="alert-box alert-error">
        <i data-lucide="alert-circle" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
        <span id="login-alert-text">Invalid login credentials.</span>
      </div>

      <div id="setup-hint" class="alert-box alert-info">
        <i data-lucide="info" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
        <span>Supabase not connected. You can explore the portal using <strong>Preview Demo Mode</strong> or connect your project.</span>
      </div>

      <form id="admin-login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Admin Email Address</label>
          <div class="input-with-icon">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="login-email" class="form-control" placeholder="admin@pcmcwashingcentre.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-with-icon">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="btn-toggle-pwd" id="btn-toggle-pwd" aria-label="Toggle password visibility">
              <i data-lucide="eye" style="width: 16px; height: 16px;"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-login" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;">
          <i data-lucide="log-in"></i> Sign In to ERP
        </button>
      </form>

      <div class="demo-access-box">
        <button type="button" class="btn btn-secondary btn-sm" id="btn-demo-mode" style="width: 100%;">
          <i data-lucide="sparkles"></i> Explore Demo Mode (Offline Preview)
        </button>
      </div>

      <div class="login-footer-links">
        <a href="../index.html"><i data-lucide="arrow-left" style="width: 14px; height: 14px; vertical-align: middle;"></i> Return to Website</a>
        <a href="settings.html#supabase"><i data-lucide="settings" style="width: 14px; height: 14px; vertical-align: middle;"></i> Supabase Setup</a>
      </div>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      const form = document.getElementById('admin-login-form');
      const emailInput = document.getElementById('login-email');
      const pwdInput = document.getElementById('login-password');
      const alertBox = document.getElementById('login-alert');
      const alertText = document.getElementById('login-alert-text');
      const setupHint = document.getElementById('setup-hint');
      const submitBtn = document.getElementById('btn-login');
      const demoBtn = document.getElementById('btn-demo-mode');
      const togglePwdBtn = document.getElementById('btn-toggle-pwd');

      // Check if Supabase is connected
      const isConfigured = window.PCMC_SUPABASE && window.PCMC_SUPABASE.isReady();
      if (!isConfigured) {
        setupHint.style.display = 'flex';
      }

      // Check URL error parameter
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('error') === 'unauthorized') {
        showAlert('Access Denied: Your account is authenticated but not registered in authorized administrators list.');
      } else if (urlParams.get('error') === 'auth_error') {
        showAlert('Session expired or authentication error. Please log in again.');
      }

      function showAlert(msg) {
        alertText.textContent = msg;
        alertBox.style.display = 'flex';
        lucide.createIcons();
      }

      // Password toggle
      togglePwdBtn.addEventListener('click', () => {
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        togglePwdBtn.innerHTML = isPwd ? '<i data-lucide="eye-off" style="width:16px;height:16px;"></i>' : '<i data-lucide="eye" style="width:16px;height:16px;"></i>';
        lucide.createIcons();
      });

      // Submit Login
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const email = emailInput.value.trim();
        const password = pwdInput.value;

        if (!email || !password) {
          showAlert('Please enter both email and password.');
          return;
        }

        if (!isConfigured) {
          showAlert('Supabase is not configured yet. Click "Explore Demo Mode" below to preview, or configure your Supabase URL in Setup.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i data-lucide="loader" class="spin"></i> Signing in...';
        lucide.createIcons();

        try {
          await window.PCMC_AUTH.login(email, password);
          const redirect = urlParams.get('redirect') || 'dashboard.html';
          window.location.href = redirect;
        } catch (err) {
          showAlert(err.message || 'Failed to sign in. Please verify your email and password.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i data-lucide="log-in"></i> Sign In to ERP';
          lucide.createIcons();
        }
      });

      // Demo Mode button
      demoBtn.addEventListener('click', () => {
        window.location.href = 'dashboard.html';
      });
    });
  </script>
</body>
</html>
